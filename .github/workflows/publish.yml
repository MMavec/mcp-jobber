name: Publish to PyPI

# Publishes the package to PyPI when a GitHub Release is published, using PyPI
# Trusted Publishing (OIDC) — no API token stored in the repo.
#
# One-time setup on PyPI: create the `mcp-jobber` project (or a "pending
# publisher"), then add a Trusted Publisher with:
#   owner = MMavec, repo = mcp-jobber, workflow = publish.yml, environment = pypi
# Docs: https://docs.pypi.org/trusted-publishers/

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # required for Trusted Publishing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
